<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <style>
    .left-half {
      transform-origin: 100px 85px;
      animation: snip-left 3s ease-in-out infinite;
    }
    .right-half {
      transform-origin: 100px 85px;
      animation: snip-right 3s ease-in-out infinite;
    }
    .motion-pop {
      transform-origin: 100px 20px;
      animation: pop 3s ease-out infinite;
      opacity: 0;
    }
    @keyframes snip-left {
      0%, 60%, 100% { transform: rotate(0deg); }
      10% { transform: rotate(-14deg); }
      20% { transform: rotate(2deg); }
      30% { transform: rotate(-14deg); }
      40% { transform: rotate(0deg); }
    }
    @keyframes snip-right {
      0%, 60%, 100% { transform: rotate(0deg); }
      10% { transform: rotate(14deg); }
      20% { transform: rotate(-2deg); }
      30% { transform: rotate(14deg); }
      40% { transform: rotate(0deg); }
    }
    @keyframes pop {
      0%, 8%, 18%, 28%, 38%, 100% { opacity: 0; transform: scale(0.5) translateY(5px); }
      10%, 30% { opacity: 1; transform: scale(1.1) translateY(-2px); }
      15%, 35% { opacity: 0; transform: scale(1.2) translateY(-6px); }
    }
    .motion-group {
      transform-origin: center;
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-4px) scale(1.02); }
    }
  </style>

  <g class="motion-group">
    <circle cx="100" cy="100" r="98" fill="#ffffff" />
    
    <!-- Left Scissor Half (with left line attached) -->
    <g class="left-half">
      <!-- Left horizontal line -->
      <line x1="30" y1="110" x2="65" y2="110" stroke="#111111" stroke-width="3" stroke-linecap="round" />
      
      <circle cx="85" cy="125" r="14" fill="none" stroke="#111111" stroke-width="3" />
      <circle cx="85" cy="125" r="8" fill="#111111" />
      <path d="M 85 111 L 100 85 L 120 35 L 115 33 Z" fill="none" stroke="#111111" stroke-width="2" stroke-linejoin="round" />
    </g>

    <!-- Right Scissor Half (with right line attached) -->
    <g class="right-half">
      <!-- Right horizontal line -->
      <line x1="135" y1="110" x2="170" y2="110" stroke="#111111" stroke-width="3" stroke-linecap="round" />
      
      <circle cx="115" cy="125" r="14" fill="none" stroke="#111111" stroke-width="3" />
      <circle cx="115" cy="125" r="8" fill="#111111" />
      <path d="M 115 111 L 100 85 L 80 35 L 85 33 Z" fill="none" stroke="#111111" stroke-width="2" stroke-linejoin="round" />
      <path d="M 94 65 L 98 62 M 90 55 L 94 52 M 86 45 L 90 42" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Motion Lines & Drops (Pops when snipping) -->
    <g class="motion-pop">
      <!-- 3 action lines shooting from the tip -->
      <path d="M 90 20 L 85 8 M 100 15 L 100 3 M 110 20 L 115 8" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" />
      <!-- Small cut hair pieces dropping -->
      <path d="M 80 40 L 75 45 M 120 40 L 125 45 M 105 25 L 108 30" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Scissors Pivot -->
    <circle cx="100" cy="85" r="3" fill="#111111" />
    
    <!-- Hair swoop -->
    <path d="M 80 35 Q 90 20 120 20" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" />

    <!-- Text -->
    <text x="100" y="165" font-family="'Inter', 'Arial', sans-serif" font-size="22" font-weight="600" letter-spacing="4" text-anchor="middle" fill="#111111">KQ CUT<tspan fill="#d4af37">Z</tspan></text>
  </g>
</svg>
